name: Deploy sincioco-free

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-sincioco-free-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    # Keep all hosted execution disabled until the secure handoff is complete.
    # Only a verified public repository may allocate the standard hosted runner.
    if: >-
      github.repository == 'Sincioco/SinciocoWeb' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.repository.private == false &&
      github.event.repository.visibility == 'public' &&
      vars.AZURE_SINCIOCO_FREE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURE_SINCIOCO_FREE_DEPLOY_ENABLED: ${{ vars.AZURE_SINCIOCO_FREE_DEPLOY_ENABLED }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify trusted public main context
        run: python3 -B .github/static-site/check-release-gate.py

      - name: Test publication and release boundaries
        run: python3 -B .github/static-site/test-ci.py

      - name: Prepare only allowlisted public files
        run: python3 -B .github/static-site/prepare-site.py

      - name: Verify complete payload and migration routes
        run: |
          python3 -B .github/static-site/prepare-site.py --check
          python3 -B .github/static-site/verify-stage.py

      - name: Check authored main-site SEO
        shell: pwsh
        run: ./tools/Check-SEO.ps1

      - name: Require the app-scoped deployment secret
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN_SINCIOCO_FREE: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SINCIOCO_FREE }}
        run: python3 -B .github/static-site/check-release-gate.py --require-secret

      - name: Publish the validated production payload
        id: publish
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # inspected official v1 commit
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: 'false'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SINCIOCO_FREE }}
          action: upload
          app_location: .github/static-site/website
          output_location: ''
          api_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Check the reported Azure application
        env:
          SWA_DEPLOYED_SITE_URL: ${{ steps.publish.outputs.static_web_app_url }}
        run: python3 -B .github/static-site/check-release-gate.py --verify-deployment

      - name: Verify live content and canonical routes
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./.github/static-site/Verify-Live.ps1 -ReportName actions-live.json
          if ($LASTEXITCODE -ne 0) { throw 'Published content verification failed.' }
          pwsh -NoProfile -File ./.github/static-site/Verify-SEO-Live.ps1 -ReportName actions-seo.json
          if ($LASTEXITCODE -ne 0) { throw 'Published SEO verification failed.' }
